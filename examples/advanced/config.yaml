service:
  name: api-gateway
  environment: production
  replicas: 4
  endpoint: https://api.example.com
  labels:
    owner: platform
    tier: edge

auth:
  username: deploy
  password: secret-from-environment

workers:
  - name: events
    concurrency: 8
  - name: cleanup
    concurrency: 2

notifications:
  enabled: true
  webhook: https://hooks.example.com/deployments
