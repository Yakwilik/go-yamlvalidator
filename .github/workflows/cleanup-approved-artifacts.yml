name: Delete approved old artifacts

on:
  push:
    branches: ["dot/storage-cleanup-2026-11-05"]
    paths: [".github/workflows/cleanup-approved-artifacts.yml"]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only explicitly approved artifact IDs and verify
        uses: actions/github-script@v7
        with:
          script: |
            const expectedRepository = "Yakwilik/go-yamlvalidator";
            if (`${context.repo.owner}/${context.repo.repo}` !== expectedRepository) throw new Error('Repository mismatch');
            const expected = [{"id":12116144264,"name":"coverage-39076020032-1","size_in_bytes":38847,"created_at":"2026-10-17T22:41:01Z"},{"id":10982909339,"name":"coverage-36451932221-1","size_in_bytes":36557,"created_at":"2026-09-28T16:34:24Z"},{"id":10983057218,"name":"coverage-36450337054-1","size_in_bytes":36553,"created_at":"2026-09-28T16:21:12Z"},{"id":10983810581,"name":"coverage-36450257528-1","size_in_bytes":36547,"created_at":"2026-09-28T16:20:43Z"},{"id":10981775623,"name":"coverage-36447818818-1","size_in_bytes":36556,"created_at":"2026-09-28T16:00:39Z"},{"id":10979703067,"name":"coverage-36445626286-1","size_in_bytes":36557,"created_at":"2026-09-28T15:43:04Z"},{"id":10980406800,"name":"coverage-36445412557-1","size_in_bytes":36580,"created_at":"2026-09-28T15:41:22Z"}];
            const list = () => github.paginate(github.rest.actions.listArtifactsForRepo, { ...context.repo, per_page: 100 });
            const before = await list();
            const byId = new Map(before.map(a => [a.id, a]));
            for (const item of expected) {
              const artifact = byId.get(item.id);
              if (!artifact) continue;
              for (const key of ['name', 'size_in_bytes', 'created_at']) {
                if (artifact[key] !== item[key]) throw new Error(`Metadata mismatch for ${item.id}: ${key}`);
              }
            }
            let deleted = 0;
            let removedBytes = 0;
            for (const item of expected) {
              if (!byId.has(item.id)) continue;
              try {
                await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: item.id });
                deleted++;
                removedBytes += item.size_in_bytes;
                core.info(`Deleted confirmed artifact ${item.id} (${item.name})`);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info(`Artifact ${item.id} already absent`);
              }
            }
            const after = await list();
            const expectedIds = new Set(expected.map(a => a.id));
            const remaining = after.filter(a => expectedIds.has(a.id));
            if (remaining.length) throw new Error(`Approved artifacts remain: ${remaining.map(a => a.id)}`);
            const result = { expected: expected.length, deleted, alreadyAbsent: expected.length - deleted, removedBytes, approvedArtifactsRemaining: remaining.length, otherArtifactsKept: after.length };
            core.info(JSON.stringify(result));
            await core.summary.addHeading('Approved artifact cleanup').addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
