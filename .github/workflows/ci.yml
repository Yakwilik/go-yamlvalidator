name: CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify modules
        run: go mod verify
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  quality:
    name: Static analysis and vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - run: go test -race ./...

  json-schema-conformance:
    name: JSON Schema conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: json-schema-org/JSON-Schema-Test-Suite
          path: .json-schema-test-suite
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Run official JSON Schema suite
        env:
          JSON_SCHEMA_TEST_SUITE: ${{ github.workspace }}/.json-schema-test-suite
        run: go test -tags=conformance -run TestOfficialJSONSchemaTestSuite -count=1 .
