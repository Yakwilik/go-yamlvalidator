name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify modules
        run: go mod verify
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  coverage:
    name: Public library coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true
      - name: Enforce 80% coverage for public library packages
        run: ./scripts/check-library-coverage.sh coverage.out
      - name: Preserve coverage report in GitHub
        if: always() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: error
      # The measured 80% gate above remains mandatory. A reporting-service
      # outage must not discard the artifact or masquerade as a test failure.
      - name: Publish coverage to Coveralls
        id: coveralls
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: golang
      - name: Report optional Coveralls upload failure
        if: steps.coveralls.outcome == 'failure'
        run: |
          echo '::warning::Coveralls upload failed. Required coverage gate passed; report is preserved in GitHub artifacts.'
          echo 'Coveralls upload failed; the required 80% gate passed. Download the coverage artifact from this run.' >> "$GITHUB_STEP_SUMMARY"

  agent-skill:
    name: Agent skill examples (candidate or published API)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check standalone recipes against this candidate
        if: github.event_name != 'release'
        run: bash skills/go-yamlvalidator/scripts/check-examples.sh --local .
      - name: Check standalone recipes against the published module
        if: github.event_name == 'release'
        run: bash skills/go-yamlvalidator/scripts/check-examples.sh --version "${{ github.event.release.tag_name }}"

  quality:
    name: Static analysis and vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # staticcheck 2025.1.1 cannot read Go 1.27 export data, while
          # govulncheck v1.8.0 requires Go >= 1.26. Go 1.26.6 also contains
          # the stdlib fix for GO-2026-6218.
          go-version: "1.26.6"
          cache: true
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 $(go list ./... | grep -v '/internal/thirdparty/')
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  api-compat:
    name: API compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - name: Compare public API with freeze baseline
        run: ./scripts/check-api-compat.sh v1.0.0

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - run: go test -race ./...

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true
      - name: Run fuzz targets
        run: |
          for target in \
            FuzzNativeValidationNoPanic \
            FuzzJSONSchemaValidationNoPanic \
            FuzzCompileJSONSchemaNoPanic \
            FuzzPathTokensRoundTrip \
            FuzzExactNumberRangeNoPanic \
            FuzzHighLevelTagGrammar \
            FuzzHighLevelOuterTag \
            FuzzHighLevelYAML \
            FuzzHighLevelReflectShape
          do
            package=.
            case "$target" in FuzzHighLevel*) package=./internal/engine ;; esac
            go test "$package" -run '^$' -fuzz="^${target}$" -fuzztime=2s
          done

  json-schema-conformance:
    name: JSON Schema conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: json-schema-org/JSON-Schema-Test-Suite
          path: .json-schema-test-suite
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Run official JSON Schema suite
        env:
          JSON_SCHEMA_TEST_SUITE: ${{ github.workspace }}/.json-schema-test-suite
        run: go test -tags=conformance -run TestOfficialJSONSchemaTestSuite -count=1 .
